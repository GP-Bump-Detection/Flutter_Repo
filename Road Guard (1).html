<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Road Guard — Prototype v0.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;500;600&family=Inter:wght@400;600;700&family=Manrope:wght@500;700;800&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Concept tokens. Each concept: dark (body.c-x) and light (body.c-x.light). ===== */
:root{--navy:#081525;--n2:#0D1F34;--surf:#122A43;--line:#1E3A56;--txt:#F3FAFF;--sub:#93A9BD;--cy:#00D5E8;--cy2:#58EEF8;--ct:#041320;--amb:#FFB547;--grn:#35CBA0;--red:#FF6B6B;--glow:#58EEF8;--street:#16304b;--route:#00D5E8;--alertbg:#3a2a0c;--radius:18px;--btnr:14px;--head:"Sora",system-ui,sans-serif;--body:"Inter",system-ui,sans-serif;--num:"Sora",system-ui,sans-serif}
body.c-midnight{--navy:#070F1C;--n2:#0C1A2E;--surf:#11223A;--line:#23395A;--txt:#EEF6FF;--sub:#A3B8CE;--cy:#22D6EA;--cy2:#7AECF7;--ct:#03121B;--amb:#FFB84D;--grn:#3DD6A6;--red:#FF7B7B;--glow:#7AECF7;--street:#17304E;--route:#22D6EA;--alertbg:#3A2A0C;}
body.c-midnight.light{--navy:#E9F1F8;--n2:#F5F9FC;--surf:#FFFFFF;--line:#D3E1EC;--txt:#0B1D31;--sub:#445A76;--cy:#0A7889;--cy2:#1BA3B8;--ct:#FFFFFF;--amb:#8F5A00;--grn:#13734F;--red:#B42318;--glow:#0A7889;--street:#CDDEEA;--route:#0A7889;--alertbg:#FFF1D6;}
body.c-urban{--navy:#10201F;--n2:#162B2A;--surf:#1B3432;--line:#2A4845;--txt:#F1F6F3;--sub:#9DB8B0;--cy:#8DB6A1;--cy2:#A9CCBB;--ct:#0F1E1D;--glow:#8DB6A1;--street:#22403D;--route:#8DB6A1;--alertbg:#3a3010;--num:"Manrope",system-ui,sans-serif}
body.c-urban.light{--navy:#F7F8F4;--n2:#EEF2EE;--surf:#FFFFFF;--line:#E6EBE7;--txt:#263238;--sub:#5F6E73;--cy:#164B51;--cy2:#2A6B73;--ct:#F7F8F4;--amb:#C7851C;--grn:#3E8E72;--red:#C0524A;--glow:#164B51;--street:#E1E8E3;--route:#164B51;--alertbg:#FBF1DE}
body.c-velocity{--navy:#111417;--n2:#171B1F;--surf:#252A30;--line:#343B43;--txt:#F2F4F6;--sub:#8A949E;--cy:#FFB020;--cy2:#FFCB5C;--ct:#111417;--amb:#FFB020;--grn:#4FD18B;--red:#FF5A4E;--glow:#FFB020;--street:#222830;--route:#FFB020;--alertbg:#3b2b08;--num:"Barlow Condensed",system-ui,sans-serif}
body.c-velocity.light{--navy:#E9ECEF;--n2:#F6F7F8;--surf:#FFFFFF;--line:#D5DBE1;--txt:#111417;--sub:#5B6570;--cy:#C98200;--cy2:#E09A1A;--ct:#111417;--glow:#C98200;--street:#D5DBE1;--route:#C98200;--alertbg:#FFF1D6}
/* Electric Blue accent overrides any concept (listed last so it wins) */
body.acc-blue,body.acc-blue.light{--cy:#20D6E8;--cy2:#8BF2FB;--ct:#06202a;--glow:#46E6F2;--route:#20D6E8}
body.acc-blue.light{--cy:#0E9FB0;--cy2:#3CC7D6;--ct:#FFFFFF;--glow:#0E9FB0;--route:#0E9FB0}

/* ===== Base layout (shared) ===== */
*{box-sizing:border-box;margin:0}
body{background:#030507;font-family:var(--body);color:var(--txt);min-height:100vh;display:flex;justify-content:center;align-items:center}
#app{position:relative;width:min(100vw,400px);height:min(100vh,840px);background:var(--navy);overflow:hidden;border-radius:24px;box-shadow:0 0 0 1px var(--line),0 20px 60px #000}
@media(max-width:500px){#app{width:100vw;height:100vh;border-radius:0}}
#scr{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;overflow-y:auto;padding:22px 18px;animation:fi .35s ease}
#scr.map{padding:0;gap:0;overflow:hidden}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes wv{0%,100%{height:5px}50%{height:22px}}
h1,h2{font-family:var(--head)}
h1{font-size:32px;letter-spacing:.5px}h2{font-size:21px;line-height:1.25}
.sub{color:var(--sub);font-size:13px;line-height:1.5}
.sm2{font-size:11px}
.cy{color:var(--cy)}
.mt{margin-top:12px}.sp{flex:1}.row{display:flex;align-items:center;gap:8px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
.logo{width:84px;height:84px}
.ill{width:100%;height:300px;border-radius:var(--radius);background:var(--surf);display:flex;align-items:center;justify-content:center;border:1px solid var(--line);position:relative;overflow:hidden}
input,select,textarea{width:100%;background:var(--n2);border:1px solid var(--line);color:var(--txt);border-radius:var(--btnr);padding:12px;font-size:15px;font-family:var(--body);outline:none;margin-top:6px}
input:focus,textarea:focus{border-color:var(--cy)}
label{font-size:13px;color:var(--sub)}
.err{color:var(--red);font-size:13px;min-height:18px}
.btn{background:linear-gradient(var(--cy2),var(--cy));color:var(--ct);border:0;border-radius:var(--btnr);padding:13px 14px;font-family:var(--body);font-weight:700;font-size:15px;cursor:pointer;width:100%;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 18px -8px var(--cy)}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--n2);color:var(--txt);border:1px solid var(--line);font-weight:600;box-shadow:none}
.btn.red{background:#D9434A;color:#fff;box-shadow:none}
.btn.sm{width:auto;padding:8px 12px;font-size:13px}
.btn.ic{width:auto;padding:7px 9px;background:var(--n2);color:var(--cy);border:1px solid var(--line);box-shadow:none}
.wbtn{background:var(--txt);color:var(--navy);border:0;border-radius:var(--btnr);padding:14px;font-weight:600;font-size:15px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
.wbtn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--cy);font-size:14px;cursor:pointer;padding:6px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.cmp{padding:10px 12px}
.item{background:var(--surf);border:1px solid var(--line);border-radius:var(--radius);padding:12px;cursor:pointer;display:flex;gap:12px;align-items:center;color:var(--txt);width:100%;text-align:left;font-family:var(--body)}
.ico{width:40px;height:40px;border-radius:var(--btnr);background:var(--n2);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--cy)}
.tag{font-size:11px;padding:3px 8px;border-radius:var(--btnr);background:var(--n2);color:var(--sub);white-space:nowrap}
.st-Pending{color:var(--amb)}.st-Under{color:var(--glow)}.st-Verified{color:var(--grn)}.st-Rejected{color:var(--red)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat div{background:var(--n2);border-radius:var(--btnr);padding:10px 4px;text-align:center;font-size:11px;color:var(--sub)}
.stat b{display:block;color:var(--txt);font-family:var(--num);font-size:19px;margin-bottom:2px;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:7px;height:7px;border-radius:9px;background:var(--line)}.dots i.on{background:var(--cy);width:20px}
.seg{display:flex;background:var(--n2);border-radius:var(--btnr);padding:4px;gap:4px}
.seg button{flex:1;background:none;border:0;color:var(--sub);padding:9px;border-radius:calc(var(--btnr) - 4px);font-family:var(--body);font-size:13px;cursor:pointer}
.seg button.on{background:var(--surf);color:var(--cy);font-weight:700;box-shadow:inset 0 0 0 1px var(--cy)}
.sw{width:44px;height:24px;border-radius:12px;background:var(--line);border:0;position:relative;cursor:pointer;flex:0 0 auto}
.sw:after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--cy)}.sw.on:after{left:23px}
.chat{display:flex;flex-direction:column;gap:8px;height:46vh;overflow-y:auto;padding:4px}
.bub{max-width:80%;padding:10px 12px;border-radius:var(--radius);font-size:14px;line-height:1.4}
.me{align-self:flex-end;background:var(--cy);color:var(--ct);border-bottom-right-radius:4px}
.them{align-self:flex-start;background:var(--surf);color:var(--txt);border:1px solid var(--line);border-bottom-left-radius:4px}
.wave{display:flex;gap:3px;align-items:center;height:28px;justify-content:center;margin-top:8px}
.wave i{width:3px;background:var(--cy);border-radius:3px;height:5px}
.wave.live i{animation:wv .9s ease-in-out infinite}
.wave.live i:nth-child(2n){animation-delay:.2s}.wave.live i:nth-child(3n){animation-delay:.4s}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--navy);border-bottom:1px solid var(--line)}
#map{position:relative;flex:1;min-height:200px;background:var(--navy);overflow:hidden}
#map>svg{position:absolute;inset:0;width:100%;height:100%}
#map line{stroke:var(--street)!important}
#dyn polyline{stroke:var(--route)!important}
#map text{fill:var(--sub)!important}
#search{position:absolute;top:10px;left:10px;right:10px;z-index:5;background:color-mix(in srgb,var(--surf) 94%,transparent);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;box-shadow:0 8px 22px #0006}
#search .r{display:flex;gap:10px;align-items:center;font-size:13px;padding:4px 0}
#search .r+.r{border-top:1px solid var(--line);margin-top:4px;padding-top:8px}
#search input{margin-top:0;padding:8px 10px;font-size:14px}
#sugg{background:var(--surf);border-radius:var(--btnr);margin-top:6px;overflow:hidden}
#sugg button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--txt);padding:10px 12px;font-size:14px;cursor:pointer;font-family:var(--body)}
#sheet{display:none;position:absolute;left:0;right:0;bottom:0;max-height:82%;background:var(--n2);border-radius:var(--radius) var(--radius) 0 0;z-index:10;flex-direction:column;box-shadow:0 -10px 30px #0008;animation:up .3s ease}
#sheet.open{display:flex}
.sh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
#shB{padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
#bottom{padding:10px 12px;background:var(--navy);border-top:1px solid var(--line);max-height:34%;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
#dock{display:flex;justify-content:space-around;padding:6px 10px 10px;background:var(--navy);border-top:1px solid var(--line)}
.dk{background:none;border:0;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--body);font-size:11px;padding:6px 12px;border-radius:var(--btnr);cursor:pointer}
.dk.on{color:var(--cy);background:var(--n2)}
.dk.on svg{filter:drop-shadow(0 0 6px var(--cy))}
#toast{position:absolute;left:16px;right:16px;bottom:18px;background:var(--navy);border:1px solid var(--cy);border-radius:var(--btnr);padding:10px 12px;opacity:0;transition:.3s;z-index:50;font-size:14px;pointer-events:none;color:var(--txt)}
.card[style*="3a2a0c"]{background:var(--alertbg)!important}
.ill-float{width:100%;height:320px;display:flex;align-items:center;justify-content:center;position:relative}
.ill-float img{width:100%;height:100%;object-fit:contain;-webkit-mask-image:radial-gradient(ellipse 70% 66% at 50% 48%,#000 58%,transparent 100%);mask-image:radial-gradient(ellipse 70% 66% at 50% 48%,#000 58%,transparent 100%)}
.ill-float.sm{height:190px}
#scr .splash-bg{-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
</style></head>

function act(a,d){
 switch(a){
 case 'ob-next':S.ob=Math.min(2,S.ob+1);break;
 case 'ob-skip':go('auth');return;
 case 'authtab':S.auth=d.t;S.err='';break;
 case 'auth':doAuth();return;
 case 'perm':S.gps=d.g==='1';go('map');return;
 case 'logout':Object.assign(S,{user:null,trip:null,dest:null,sum:null,panel:null,sel:null,rsel:null,hl:false,f:{},err:'',q:'',sugg:false,auth:'choose'});go('auth');return;
 case 'tab':S.panel=d.t==='map'?(S.trip?'trip':null):d.t;S.sel=S.rsel=null;S.hl=false;break;
 case 'close':S.panel=null;S.sel=S.rsel=null;break;
 case 'back':S.sel=S.rsel=null;break;
 case 'htab':S.hTab=d.t;break;
 case 'mute':S.prefs.audio=!S.prefs.audio;break;
 case 'dest':if(S.trip){toast('End the current trip before changing destination');break}
   S.dest=DEST.find(x=>x.n===d.n);S.sugg=false;S.q='';S.sum=null;{const qi=$('#q');if(qi)qi.value=''}break;
 case 'clear':if(S.trip){toast('End the current trip first');break}S.dest=null;break;
 case 'start':startTrip();break;
 case 'pause':if(S.trip){S.trip.st=S.trip.st==='active'?'paused':'active';S.trip.note=''}break;
 case 'uturn':if(S.trip){S.trip.dir*=-1;S.trip.uturns++;S.trip.note='U-turn simulated: upcoming bumps recalculated.'}break;
 case 'end':endTrip();return;
 case 'sumdone':if(S.sumFrom==='hist'){S.panel='hist';S.sum=null}else{S.sum=null;S.dest=null;S.panel=null}S.sumFrom=null;break;
 case 'open':S.sum=S.trips.find(x=>x.id===d.id);S.sumFrom='hist';S.panel='sum';break;
 case 'preview':S.panel=null;S.hl=true;toast('Past route shown on the map (demo)');break;
 case 'rtab':S.rtab=d.t;S.rsel=null;S.rdone=false;break;
 case 'voice':S.rf.voice=!S.rf.voice;break;
 case 'submit':submitReport();break;
 case 'rdone':S.rdone=false;S.rtab='mine';break;
 case 'ropen':S.rsel=d.id;break;
 case 'send':sendMsg();break;
 case 'vnote':toast('Voice note is simulated in this prototype');break;
 case 'mark':{const p=S.trip?S.trip.pos:0;S.marks.push({p});S.reports.unshift({id:'RG-'+(1050+S.reports.length),date:'Today',loc:'Marked by you',desc:'Speed bump marker added from the map',st:'Pending'});toast('Speed bump marker added · Pending review');break}
 case 'theme':S.theme=d.v;applyTheme();break;
 case 'accent':S.accent=d.v;applyTheme();break;
 case 'concept':S.concept=d.v;S.theme=d.v==='urban'?'light':'dark';applyTheme();break;
 case 'setsup':S.setSup=!S.setSup;break;
 case 'pref':S.prefs[d.k]=!S.prefs[d.k];break;
 case 'info':S.setInfo=S.setInfo===d.k?null:d.k;break;
 }
 if(a==='tab'&&d.t==='hist')S.hTab=S.hTab||'recent';
 U()}

function tick(){const T=S.trip;if(!T||T.st!=='active'||!S.dest)return;
 const dt=.25,km=S.dest.km,old=T.pos;
 T.pos=Math.min(1,Math.max(0,T.pos+T.dir*.006));T.dist+=Math.abs(T.pos-old)*km;T.el+=dt;
 BUMPS.forEach(b=>{if((b.p-T.pos)*T.dir<0)T.counted.add(b.id)});
 ahead().forEach(b=>{const d=Math.abs(b.p-T.pos)*km*1000;
  if(d<=200&&!T.warned.has(b.id)&&S.prefs.alerts){T.warned.add(b.id);T.warnN++;T.alert={id:b.id,d:Math.round(d),sev:b.sev};T.alertT=8;
   if(S.prefs.audio)speakSev(b,Math.round(d))}});
 [...T.warned].forEach(id=>{const b=BUMPS.find(x=>x.id===id);if((b.p-T.pos)*T.dir<=0)T.warned.delete(id)});
 if(T.alert){const b=BUMPS.find(x=>x.id===T.alert.id);T.alertT-=dt;
  if(T.alertT<=0||(b.p-T.pos)*T.dir<=0)T.alert=null;else T.alert.d=Math.round(Math.abs(b.p-T.pos)*km*1000)}
 if(T.dir>0&&T.pos>=1)return endTrip();
 if(T.dir<0&&T.pos<=0){T.dir=1;T.note='Route start reached; now heading forward.'}
 if(S.screen==='map'){drawDyn();drawBottom();if(S.panel==='trip')drawSheet()}}

document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');
 if(!e.target.closest('#search')&&S.sugg){S.sugg=false;if(S.screen==='map')drawSugg()}
 if(t&&!t.disabled)act(t.dataset.a,t.dataset)});
document.addEventListener('input',e=>{const el=e.target;
 if(el.id==='q'){S.q=el.value;S.sugg=true;drawSugg()}
 else if(el.dataset.f==='desc')S.rf.desc=el.value;
 else if(['em','pw','pw2'].includes(el.id))S.f[el.id]=el.value});
document.addEventListener('change',e=>{if(e.target.dataset.f==='lang'){S.prefs.lang=e.target.value;if(S.prefs.lang==='Arabic')toast('Arabic translation is not implemented; the UI stays in English')}});
document.addEventListener('focusin',e=>{if(e.target.id==='q'&&S.screen==='map'){S.sugg=true;drawSugg()}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;
 if(e.target.id==='msg')act('send',{});
 else if(['em','pw','pw2'].includes(e.target.id)&&S.screen==='auth')act('auth',{})});

applyTheme();render();
setInterval(tick,250);
</script><script>
/* ===== Driving alerts and account layer ===== */
const SPEED=45;
const KIND={green:['EARLY WARNING','Speed bump ahead','A hazard is ahead. Keep a safe speed.'],yellow:['APPROACHING HAZARD','Prepare to slow down','Reduce speed smoothly and prepare to pass safely.'],red:['SLOW DOWN NOW','Hazard very close','Reduce speed now and pass the hazard carefully.']};
const STC={green:'var(--grn)',yellow:'var(--amb)',red:'var(--red)'};
S.routeReady=false;S.permissions={location:true,sensors:true,background:false,sound:true};S.warnDist=200;S.role='Driver';S.userName='';S.cmpForm=false;S.cmpErr='';S.hzId=null;S.markerAlt=false;
S.complaints=[{id:1,subject:'Incorrect hazard location',description:'A speed bump marker seems slightly offset from the actual location.',status:'In review',date:'Oct 26, 2026'}];
PT.hz='Hazard details';
speakSev=function(){};
function alertStageFor(distance,speed){const red=Math.max(45,speed*1.8),yellow=Math.max(150,speed*5),green=Math.max(S.warnDist,speed*11);if(distance<=red)return'red';if(distance<=yellow)return'yellow';if(distance<=green)return'green';return null}
function playWarningSound(stage,speed){if(!S.prefs.audio||!S.permissions.sound)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ctx=window.rgAudioContext||(window.rgAudioContext=new AC());if(ctx.state==='suspended')ctx.resume();const pattern=stage==='green'?[660]:stage==='yellow'?[760,760]:[880,880,880];const base=stage==='green'?.13:stage==='yellow'?.27:Math.min(.55,.38+speed/500);pattern.forEach((freq,i)=>{const start=ctx.currentTime+i*(stage==='red'?.145:.2),osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(freq,start);gain.gain.setValueAtTime(.001,start);gain.gain.exponentialRampToValueAtTime(base,start+.018);gain.gain.exponentialRampToValueAtTime(.001,start+.145);osc.connect(gain);gain.connect(ctx.destination);osc.start(start);osc.stop(start+.16)})}catch(e){}}
function stageLoop(){const T=S.trip;if(!T)return;if(T.st!=='active'||!S.dest){T.stage=null;return}
 const km=S.dest.km,A=ahead().sort((a,b)=>Math.abs(a.p-T.pos)-Math.abs(b.p-T.pos)),h=A[0];let st=null,dist=0;
 if(h){dist=Math.abs(h.p-T.pos)*km*1000;st=alertStageFor(dist,SPEED)}
 T.stage=st;T.stageDist=dist;T.stageHz=h||null;
 if(st&&(st!==T.lastStage||(h&&h.id!==T.lastHz)))playWarningSound(st,SPEED);
 T.lastStage=st;T.lastHz=h?h.id:null}
setInterval(stageLoop,250);

function tripCard(){const T=S.trip,d=S.dest,A=ahead(),act=T.st==='active',m=Math.floor(T.el/60),s=String(Math.floor(T.el%60)).padStart(2,'0');
 const st=T.stage,col=st?STC[st]:'var(--grn)',k=st?KIND[st]:null,hz=T.stageHz;
 return `<div class="card" style="border-color:${col}"><div class="row"><span class="tag">${act?'● Active':'❚❚ Paused'} · ${S.gps?'GPS':'Demo GPS'}</span><span class="sp"></span><span class="tag" style="color:${col}">${k?k[0]:'ROUTE MONITORING'}</span></div>
 ${k?`<div class="row mt"><span style="color:${col}">${ic(IC.warn,24)}</span><div class="sp"><b>${k[1]}</b><div class="sub">${Math.round(T.stageDist)} m · ${hz.sev} severity</div><div class="sub sm2">${k[2]}</div></div></div>`:`<p class="sub mt">No immediate hazard ahead. Road Guard is monitoring your route.</p>`}
 <div class="stat"><div><b>${SPEED}</b>Speed km/h (sim)</div><div><b>${A.length}</b>Hazards ahead</div><div><b>${m}:${s}</b>Elapsed</div></div>
 <div class="row mt"><button class="btn ghost sp" data-a="pause">${act?'Pause':'Resume'}</button><button class="btn ghost sp" data-a="uturn">U-turn (demo)</button><button class="btn red sp" data-a="end">End Trip</button></div>${T.note?`<p class="sub sm2">${h(T.note)}</p>`:''}</div>`}

function planCard(){const d=S.dest;return `<div class="card cmp"><div class="row"><div class="sp"><b>${h(d.n)}</b><div class="sub sm2">From: Current location (GPS) · ${d.km} km · ${d.min} min · ${BUMPS.length} hazards${S.routeReady?' · route previewed':''}</div></div><button class="btn ic" data-a="clear" title="Clear">✕</button></div>
 <div class="row mt">${S.routeReady?`<button class="btn sp" data-a="start">Start Live Monitoring</button>`:`<button class="btn sp" data-a="route-preview">Preview route</button>`}<button class="btn ic" data-a="mark" title="Add speed bump marker">${ic(IC.marker,18)}</button></div></div>`}

function hazardList(){const km=S.dest?S.dest.km:0;return `<p class="sub mt">Route hazards</p>`+[...BUMPS].sort((a,b)=>a.p-b.p).map(b=>`<button class="item" data-a="hz-open" data-id="${b.id}"><div class="ico" style="color:${SEVHEX[b.sev]}">${ic(IC.warn,18)}</div><div class="sp"><b>Speed bump · ${b.id}</b><div class="sub">${Math.round(b.p*km*1000)} m from start</div></div><span class="tag" style="color:${SEVHEX[b.sev]}">${sevInfo(b.sev).label}</span></button>`).join('')}

const origTrip=P.trip,origHist=P.hist,origSet=P.set,origRep=P.rep;
P.trip=function(){if(!S.dest)return origTrip();return(S.trip?tripCard():planCard())+hazardList()};
P.hz=function(){const b=BUMPS.find(x=>x.id===S.hzId)||BUMPS[0],km=S.dest?S.dest.km:6.4,dist=Math.round(b.p*km*1000),rep=[8,5,11,6][BUMPS.indexOf(b)]||4;
 return `<button class="btn ghost sm" data-a="hz-back" style="width:auto;align-self:flex-start">${ic(IC.back,16)} Back</button><div class="card" style="border-color:${SEVHEX[b.sev]}"><div class="row"><span style="color:${SEVHEX[b.sev]}">${ic(IC.warn,22)}</span><div class="sp"><b>Speed bump · ${b.id}</b><div class="sub">${dist} m from start</div></div><span class="tag" style="color:${SEVHEX[b.sev]}">${sevInfo(b.sev).label} severity</span></div><div class="stat"><div><b>${dist} m</b>From start</div><div><b>${rep}</b>Driver reports</div><div><b>${sevInfo(b.sev).label}</b>Severity</div></div><p class="sub mt">Demo data. Slow down smoothly when the warning appears.</p></div>`};
P.hist=function(){const total=S.trips.reduce((s,t)=>s+t.km,0),hz=S.trips.reduce((s,t)=>s+t.bumps,0);
 return `<div class="stat"><div><b>${S.trips.length}</b>Saved trips</div><div><b>${total.toFixed(1)}</b>Total km</div><div><b>${hz}</b>Hazard passes</div></div>`+origHist()};
P.sum=function(){const r=S.sum,hist=S.sumFrom==='hist';
 return `<div class="card"><b>${h(r.to)}</b><p class="sub">${r.date}</p><p class="sub sm2 mt">From: ${h(r.from)} · ${r.status}</p><div class="stat"><div><b>${r.km} km</b>Distance</div><div><b>${r.min} min</b>Duration</div><div><b>${r.max||SPEED} km/h</b>Max speed</div></div><div class="stat"><div><b>${r.bumps}</b>Hazards passed</div><div><b>${r.warns}</b>Warnings</div><div><b>${r.reps}</b>Reports</div></div></div>${hist?'<button class="btn ghost" data-a="preview">Preview route on map</button>':''}<button class="btn" data-a="sumdone">Done</button>`};
function markerCard(){const alt=S.markerAlt;return `<div class="card cmp"><div class="row"><b>Place hazard marker</b><span class="sp"></span><span class="tag">${alt?'Ready to place':'Marker selected'}</span></div><div style="height:100px;border-radius:12px;margin-top:8px;overflow:hidden;background:var(--n2)"><svg viewBox="0 0 340 100" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">${[40,120,200,280].map(x=>`<line x1="${x}" y1="0" x2="${x+30}" y2="100" stroke="var(--street)" stroke-width="12"/>`).join('')}<circle cx="${alt?250:160}" cy="50" r="9" fill="var(--cy)" stroke="#fff" stroke-width="3"/></svg></div><button class="btn ghost mt" data-a="marker-move">${alt?'Use selected spot':'Move marker to another spot'}</button></div>`}
P.rep=function(){const base=origRep();if(S.rtab==='new'&&!S.rdone)return markerCard()+base;
 if(S.rtab==='new'||S.role==='Driver')return base;
 const q=S.reports.filter(r=>r.st==='Pending'||r.st==='Under Review');
 return base+`<p class="sub mt">Review queue · ${S.role}</p>`+(q.map(r=>`<div class="item" style="cursor:default;flex-direction:column;align-items:stretch"><div class="row"><b>${r.id}</b><span class="sp"></span><span class="st-${r.st.split(' ')[0]}">${r.st}</span></div><div class="sub sm2">${h(r.loc)} · ${h(r.desc)}</div><div class="row mt"><button class="btn sm sp" data-a="rv" data-v="approve" data-id="${r.id}">Approve</button><button class="btn ghost sm sp" data-a="rv" data-v="reject" data-id="${r.id}">Reject</button></div></div>`).join('')||'<p class="sub">Queue is empty.</p>')};

const sw=(k,l,sub)=>`<div class="item" style="cursor:default"><div class="sp"><b>${l}</b><div class="sub sm2">${sub}</div></div><button class="sw ${S.permissions[k]?'on':''}" data-a="perm-toggle" data-k="${k}"></button></div>`;
P.set=function(){const name=S.userName||'Driver',ini=name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(),km=S.trips.reduce((s,t)=>s+t.km,0),hz=S.trips.reduce((s,t)=>s+t.bumps,0);
 const admin=S.role==='Administrator'?`<p class="sub mt">Administration overview (demo)</p><div class="stat"><div><b>1,284</b>Demo users</div><div><b>${BUMPS.length+640}</b>Active hazards</div><div><b>${S.reports.filter(r=>r.st==='Pending'||r.st==='Under Review').length}</b>Awaiting review</div></div>`:'';
 const cmp=`<p class="sub mt">Complaints</p>`+S.complaints.map(c=>`<div class="item" style="cursor:default"><div class="sp"><b>${h(c.subject)}</b><div class="sub sm2">${h(c.description)}</div></div><span class="tag">${c.status}</span></div>`).join('')+`<button class="btn ghost" data-a="cmp-toggle">${S.cmpForm?'Close form':'New complaint'}</button>`+(S.cmpForm?`<div class="card"><input id="cmpSub" placeholder="Subject" style="margin-top:0"><textarea id="cmpDesc" rows="3" placeholder="Describe the problem"></textarea><div class="err">${h(S.cmpErr)}</div><button class="btn mt" data-a="cmp-submit">Submit complaint</button></div>`:'');
 const profile=`<div class="card" style="background:linear-gradient(145deg,var(--surf),var(--n2))"><div class="row"><div style="width:50px;height:50px;border-radius:50%;background:var(--cy);color:var(--ct);display:flex;align-items:center;justify-content:center;font-weight:800">${ini}</div><div class="sp"><b>${h(name)}</b><div class="sub sm2">${h(S.user.email)}</div></div><span class="tag" style="color:var(--cy)">${S.role}</span></div><div class="stat"><div><b>${S.trips.length}</b>Completed trips</div><div><b>${km.toFixed(1)}</b>Total km</div><div><b>${hz}</b>Hazard passes</div></div></div>`;
 return profile+origSet()+`<p class="sub mt">Driving & warnings</p>
 <div class="item" style="cursor:default"><div class="sp"><b>Warning distance</b><div class="sub sm2">How early Road Guard should warn you</div></div><select data-f="wd" style="width:auto;margin:0;padding:6px 8px">${[100,200,300,500].map(v=>`<option value="${v}" ${S.warnDist===v?'selected':''}>${v} m</option>`).join('')}</select></div>
 <button class="btn ghost" data-a="sound-test">${ic(IC.speaker,16)} Sound test</button>
 <p class="sub mt">Device permissions</p>${sw('location','Location access','Locate you and find hazards nearby')}${sw('sensors','Motion sensors','Accelerometer and gyroscope (demo)')}${sw('background','Background driving mode','Keep tracking while another app is open')}
 <p class="sub mt">Account role (demo)</p><div class="item" style="cursor:default"><div class="sp"><b>Role</b></div><select data-f="role" style="width:auto;margin:0;padding:6px 8px">${['Driver','Moderator','Administrator'].map(r=>`<option ${S.role===r?'selected':''}>${r}</option>`).join('')}</select></div>
 ${admin}${cmp}`};

function permHTML(){const rows=[['location','Location access','Show your current position and relevant hazards.'],['sensors','Phone motion sensors','Use accelerometer and gyroscope for on-device detection.'],['background','Background driving mode','Continue supported tracking while another app is open.'],['sound','Audio warnings','Play a sound before relevant hazards on your route.']];
 return `<div class="ill-float sm"><img src="${IMG.ONB[1]}" alt=""></div><h2 class="mt">Set up your driving alerts</h2><p class="sub">Road Guard uses location and motion sensors to detect and warn about road hazards. You can review these choices any time.</p>
 <p class="sub sm2">Illustrative controls only. This prototype does not request real device permissions.</p>
 ${rows.map(([k,l,d])=>sw(k,l,d)).join('')}<div class="sp"></div>
 <button class="btn" data-a="perm-continue">Continue</button><button class="link" data-a="perm-continue">Set up later</button>`}
const _render=render;
render=function(){_render();const c=$('#scr');if(!c)return;
 if(S.screen==='perm')c.innerHTML=permHTML();
 if(S.screen==='auth'&&S.auth!=='choose'){
   if(S.auth==='signup'&&!$('#nm')){const em=[...c.querySelectorAll('label')].find(l=>l.textContent.trim()==='Email');if(em){const w=document.createElement('div');w.innerHTML=`<label class="mt">Full name</label><input id="nm" placeholder="Your full name" value="${h(S.userName||'')}">`;em.parentNode.insertBefore(w,em)}}
   if(S.auth==='login')c.insertAdjacentHTML('beforeend','<div style="text-align:center"><button class="link" data-a="forgot">Forgot password?</button></div>');
 }};

const _doAuth=doAuth;
doAuth=function(){const nm=document.getElementById('nm');if(nm&&nm.value.trim())S.userName=nm.value.trim();return _doAuth()};

const _act=act;
act=function(a,d){let handled=true;
 switch(a){
  case 'route-preview':S.routeReady=true;toast('Route previewed. You can start monitoring.');break;
  case 'start':if(!S.routeReady){toast('Preview the route before starting navigation.');return}handled=false;break;
  case 'dest':case 'clear':S.routeReady=false;handled=false;break;
  case 'perm-toggle':S.permissions[d.k]=!S.permissions[d.k];if(d.k==='location')S.gps=S.permissions.location;break;
  case 'perm-continue':S.gps=S.permissions.location;go('map');return;
  case 'sound-test':playWarningSound('red',SPEED);toast('Sound test: red stage');break;
  case 'hz-open':S.hzId=d.id;S.panel='hz';break;
  case 'hz-back':S.panel='trip';break;
  case 'marker-move':S.markerAlt=!S.markerAlt;break;
  case 'cmp-toggle':S.cmpForm=!S.cmpForm;S.cmpErr='';break;
  case 'cmp-submit':{const sub=(document.getElementById('cmpSub')||{}).value||'',des=(document.getElementById('cmpDesc')||{}).value||'';
    if(sub.trim().length<3||des.trim().length<10){S.cmpErr='Subject needs 3+ characters and the description 10+ characters.';break}
    S.complaints.unshift({id:Date.now(),subject:sub.trim(),description:des.trim(),status:'In review',date:new Date().toDateString()});S.cmpForm=false;S.cmpErr='';toast('Complaint submitted · In review');break}
  case 'rv':{const r=S.reports.find(x=>x.id===d.id);if(r){r.st=d.v==='approve'?'Verified':'Rejected';toast(r.id+' '+r.st.toLowerCase())}break}
  case 'forgot':toast('Password recovery is not connected in this prototype.');handled=false;break;
  default:handled=false;
 }
 if(handled){U();return}
 return _act(a,d)};

const _endTrip=endTrip;
endTrip=function(){_endTrip();if(S.sum&&!S.sum.max)S.sum.max=SPEED};

document.addEventListener('change',e=>{const f=e.target.dataset.f;
 if(f==='role'){S.role=e.target.value;U()}
 if(f==='wd'){S.warnDist=+e.target.value;U()}});
document.addEventListener('input',e=>{if(e.target.id==='nm')S.userName=e.target.value});


document.addEventListener('click',()=>{if(S.screen==='splash')go('ob')});
</script></body></html>
